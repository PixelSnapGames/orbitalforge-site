  else if(f==='lev.start'||f==='lev.until'||f==='lsa.start'||f==='lsa.until'){d[f.slice(0,3)][f.slice(4)]=fromInp(v)}
  else if(f==='lsa.sec'){const k0=SECS[d.lsa.sec]&&SECS[d.lsa.sec].kind;d.lsa.sec=v;const k1=SECS[v].kind;if(k0!==k1)d.lsa.val=k1==='pct'?30:50;if(d.go.indexOf('shop:')===0||!d.go){d.go='shop:'+v;if(!d.ctaL)d.ctaL='Open the Shop';paint('cta')}paint('link');return}

function imgFromFile(file){const d=S.draft;if(!d)return;if(!file||!/^image\//.test(file.type||'')){toast('That file is not an image','err');return}

function cropRect(im,c){const W=im.naturalWidth,H=im.naturalHeight;if(c.mode==='whole')return {sx:0,sy:0,sw:W,sh:H};let bw=W,bh=W*4/3;if(bh>H){bh=H;bw=H*3/4}const sw=bw/c.z,sh=bh/c.z;return {sx:(W-sw)*c.px,sy:(H-sh)*c.py,sw,sh}}

  if(I.crop.mode==='whole'){const s=Math.min(1,900/r.sw,1200/r.sh);ow=Math.round(r.sw*s);oh=Math.round(r.sh*s)}else{ow=Math.round(Math.min(900,r.sw));oh=Math.round(ow*4/3)}
  ow=Math.max(1,ow);oh=Math.max(1,oh);const cv=document.createElement('canvas');cv.width=ow;cv.height=oh;const g=cv.getContext('2d');g.fillStyle='#0a0f2b';g.fillRect(0,0,ow,oh);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(I.src,r.sx,r.sy,r.sw,r.sh,0,0,ow,oh);
  for(const q of [0.82,0.74,0.66,0.58,0.5,0.42]){const u=cv.toDataURL('image/jpeg',q);if(u.length<=LIM.img&&/^data:image\/jpeg;base64,/.test(u)){I.data=u;I.q=q;I.w=ow;I.h=oh;I.err='';return true}}
  I.data='';I.err='This image is too detailed: even at 42% quality it is over 900 000 characters. Try a simpler or smaller picture.';return false}
let encT=0;function encodeSoon(){clearTimeout(encT);encT=setTimeout(()=>{const d=S.draft;if(!d||d.img.kind!=='doc'||!d.img.src)return;encodeImg(d);d.dirty=true;const m=$('#imeta');if(m)m.innerHTML=imgMeta(d.img);S.pv.follow=true;updateLive()},160)}
function drawCrop(){const d=S.draft,cv=$('#cropc');if(!d||!cv||!d.img.src)return;const g=cv.getContext('2d'),I=d.img,r=cropRect(I.src,I.crop);g.fillStyle='#0a0f2b';g.fillRect(0,0,cv.width,cv.height);
  if(I.crop.mode==='whole'){const s=Math.min(cv.width/r.sw,cv.height/r.sh),w=r.sw*s,h=r.sh*s;g.drawImage(I.src,0,0,r.sw,r.sh,(cv.width-w)/2,(cv.height-h)/2,w,h)}else g.drawImage(I.src,r.sx,r.sy,r.sw,r.sh,0,0,cv.width,cv.height)}
function bindCrop(){let drag=null;
  document.addEventListener('pointerdown',e=>{const cv=e.target.closest&&e.target.closest('#cropc');if(!cv||!S.draft||!S.draft.img.src||S.draft.img.crop.mode!=='crop')return;drag={x:e.clientX,y:e.clientY,w:cv.getBoundingClientRect().width};try{cv.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
  document.addEventListener('pointermove',e=>{if(!drag||!S.draft)return;const I=S.draft.img,r=cropRect(I.src,I.crop),W=I.src.naturalWidth,H=I.src.naturalHeight,k=r.sw/drag.w;const dx=(e.clientX-drag.x)*k,dy=(e.clientY-drag.y)*k;drag.x=e.clientX;drag.y=e.clientY;
    if(W>r.sw)I.crop.px=Math.max(0,Math.min(1,I.crop.px-dx/(W-r.sw)));if(H>r.sh)I.crop.py=Math.max(0,Math.min(1,I.crop.py-dy/(H-r.sh)));drawCrop()});
  document.addEventListener('pointerup',()=>{if(drag){drag=null;encodeSoon()}});
  document.addEventListener('keydown',e=>{if(!e.target||e.target.id!=='cropc'||!S.draft)return;const c=S.draft.img.crop,st=.05;const m={ArrowLeft:['px',-st],ArrowRight:['px',st],ArrowUp:['py',-st],ArrowDown:['py',st]}[e.key];if(!m)return;e.preventDefault();c[m[0]]=Math.max(0,Math.min(1,c[m[0]]+m[1]));drawCrop();encodeSoon()})}

function pvDocHTML(){return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><style>'+PV_CSS+CARD_CSS+'</style></head><body><div class="game"><div class="hud"><span class="p">◆ 312</span><span class="p g">$ 4.82M</span><span class="sp"></span><button class="bell" id="bell" aria-label="Messages">🔔<b id="bellN">0</b></button></div><div class="planet"></div><div class="dock"><i></i><i></i><i></i><i></i><i></i></div></div><div class="sbar"><span id="clock"></span><i></i></div><div class="ov" id="ov"></div><div class="closed" id="closed" hidden><div id="closedT">Card closed</div><button class="again" id="again">Open the messages again</button></div><div class="ptoast" id="ptoast" hidden></div></body></html>'}
function pvDoc(){const f=$('#pvFrame');try{return f&&f.contentDocument}catch(e){return null}}
function mountPreview(){const host=$('#pvScreen');if(!host)return;host.innerHTML='';const fr=document.createElement('iframe');fr.id='pvFrame';fr.title='Phone preview: the message as players will see it';host.appendChild(fr);
  const doc=pvDoc();if(!doc){host.innerHTML='<div class="empty">Preview unavailable in this browser.</div>';return}

function fitPreview(){const host=$('#pvScreen'),fr=$('#pvFrame');if(!host||!fr)return;const w=host.clientWidth||320,s=w/390;fr.style.transform='scale('+s+')';host.style.height=Math.round(844*s)+'px'}
function pvItems(){const d=S.draft,t=Date.now();const others=S.motd.filter(m=>m.on!==false&&m.end>t&&m.id!==d.id).map(m=>({id:m.id,tag:m.tag,k:m.k,c:m.c,t:m.t,b:m.b,src:imgSrc(m),fit:m.fit,cta:m.cta,gift:m.gift,prio:m.prio||0,start:m.start}));
  const me={id:d.id,draft:true,tag:d.tag,k:d.k,c:isHex(d.c)?d.c:'',t:d.t,b:d.b,src:d.img.kind==='doc'?d.img.data||'':d.img.kind==='url'?d.img.url:'',fit:d.fit,cta:d.go?{l:d.ctaL||actDefault(d.go),go:d.go==='url'?'url:'+d.ctaUrl:d.go}:null,gift:d.giftOn?giftClean(d.gift):null,prio:d.mode==='one'?0:(Number.isInteger(d.prio)?d.prio:0),start:isFinite(d.start)?d.start:t};
  if(me.gift&&!giftParts(me.gift).length)me.gift=null;return others.concat([me]).sort(gameOrder)}

  let h='<div class="mdCard" style="--mc:'+col+'"><div class="mdTop"><span class="mdTag">'+esc(m.k||T.l)+'</span><span class="mdPg">'+(i+1)+' / '+n+'</span><button class="mdX" aria-label="Close">✕</button></div>';

let pvT=0;function pvSoon(){clearTimeout(pvT);pvT=setTimeout(pvRender,70)}
function pvRender(){const doc=pvDoc(),d=S.draft;if(!doc||!d||!doc.getElementById('ov'))return;const P=S.pv,list=pvItems();P.list=list;const di=list.findIndex(x=>x.draft);

function evFormHTML(f){return '<section class="card form" id="evForm" aria-labelledby="evFormT"><div class="ph"><h2 id="evFormT">'+(f.id?'Edit meteor event':'New meteor event')+'</h2><button class="ib" data-act="evClose" aria-label="Close the form">'+ic('x')+'</button></div>'

function parseAmt(s){s=String(s||'').trim().replace(/,/g,'');const m=/^(\d+(?:\.\d+)?(?:e\d+)?)\s*([kmbtq]?)$/i.exec(s);if(!m)return NaN;const mul={'':1,k:1e3,m:1e6,b:1e9,t:1e12,q:1e15}[m[2].toLowerCase()];return +m[1]*mul}

  return d.mode==='set'?'Set '+what+' to '+fmtBig(d.n):(+d.n<0?'Take '+fmtBig(-d.n)+' ':'Give '+fmtBig(d.n)+' ')+what+(d.msg?' · “'+d.msg+'”':'')}

const WDL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function loadLibrary(retry){S.lib={st:'loading'};try{delete window.CC_LIBRARY}catch(e){window.CC_LIBRARY=undefined}
  return loadScript('library/library.js?v='+Math.floor(Date.now()/60000),15000)/* always the newest Library (browsers keep the file up to 10 minutes otherwise) */.then(()=>{S.lib=libParse(window.CC_LIBRARY)},e=>{S.lib={st:'missing',msg:e&&e.message||String(e)}}).then(()=>{if(S.tab==='library')soonRender()})}
function libParse(L){if(!L||typeof L!=='object'||!Array.isArray(L.items))return {st:'bad',msg:'library.js loaded, but it has no window.CC_LIBRARY.items list.'};
  const cats=(Array.isArray(L.cats)?L.cats:[]).filter(c=>c&&typeof c.id==='string'&&typeof c.n==='string'),seen={},items=[];let skipped=0;
  L.items.forEach(it=>{if(!it||typeof it!=='object'||typeof it.id!=='string'||!/^[a-z0-9-]{3,40}$/.test(it.id)||seen[it.id]||!it.msg||typeof it.msg!=='object'||typeof it.msg.t!=='string'){skipped++;return}seen[it.id]=1;items.push(it)});
  return {st:'ok',cats,items,skipped}}
function libItem(id){return S.lib&&S.lib.st==='ok'?S.lib.items.find(x=>x.id===id)||null:null}
function libImgOk(p){return typeof p==='string'&&/^[A-Za-z0-9_\-./]+\.(jpe?g|png|webp)$/i.test(p)&&p.indexOf('..')<0&&p[0]!=='/'}
/* ---- date engine: local time; a rule gives the EVENT window [start, start+hours) ---- */
function easterMD(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),x=h+l-7*m+114;return [Math.floor(x/31),x%31+1]}
function nthWeekdayDom(y,m,n,day){const last=new Date(y,m,0).getDate();if(n===-1){const ld=new Date(y,m-1,last).getDay();return last-((ld-day+7)%7)}const fd=new Date(y,m-1,1).getDay(),dd=1+((day-fd+7)%7)+(n-1)*7;return dd<=last?dd:null}
function realDate(y,m,d){const t=new Date(y,m-1,d);return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d}
function libWhen(w,now){if(!w||typeof w!=='object')return null;
  const hours=w.hours,lead=w.leadH==null?0:w.leadH,off=w.offsetDays==null?0:w.offsetDays,int=Number.isInteger;
  if(!(typeof hours==='number'&&hours>=1&&hours<=336)||!(typeof lead==='number'&&lead>=0&&lead<=240)||!(int(off)&&Math.abs(off)<=366))return null;
  /* hours are wall-clock hours, so 48 from Sat 00:00 ends Mon 00:00 even across a DST change */
  const HM=Math.round(hours*60);
  if(w.rule==='now'){const n=new Date(Math.floor(now/MIN)*MIN);return {start:n.getTime(),end:new Date(n.getFullYear(),n.getMonth(),n.getDate(),n.getHours(),n.getMinutes()+HM).getTime()}}
  const am=w.at==null?[0,'00','00']:/^([01]\d|2[0-3]):([0-5]\d)$/.exec(w.at);if(!am)return null;
  const mk=(y,mo,dd,o)=>({start:new Date(y,mo-1,dd+(o||0),+am[1],+am[2],0,0).getTime(),end:new Date(y,mo-1,dd+(o||0),+am[1],+am[2]+HM,0,0).getTime()});
  const pick=c=>{c.sort((a,b)=>a.start-b.start);for(const x of c)if(x.end>now)return x;return null};
  const Y=new Date(now).getFullYear(),c=[];
  switch(w.rule){
    case 'weekday':case 'weekend':{const day=w.rule==='weekend'?6:w.day;if(!int(day)||day<0||day>6)return null;const t0=new Date(now);
      for(let k=-16;k<=8;k++){const dt=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()+k);if(dt.getDay()===day)c.push(mk(dt.getFullYear(),dt.getMonth()+1,dt.getDate()))}return pick(c)}
    case 'date':{if(!int(w.m)||!int(w.d)||w.m<1||w.m>12||w.d<1||w.d>31)return null;for(let y=Y-1;y<=Y+8;y++)if(realDate(y,w.m,w.d))c.push(mk(y,w.m,w.d,off));return c.length?pick(c):null}
    case 'nthWeekday':{if(!int(w.m)||w.m<1||w.m>12||!int(w.day)||w.day<0||w.day>6||!(w.n===-1||(int(w.n)&&w.n>=1&&w.n<=5)))return null;for(let y=Y-1;y<=Y+8;y++){const dd=nthWeekdayDom(y,w.m,w.n,w.day);if(dd)c.push(mk(y,w.m,dd,off))}return pick(c)}
    case 'easter':{for(let y=Y-1;y<=Y+2;y++){const e=easterMD(y);c.push(mk(y,e[0],e[1],off))}return pick(c)}
    case 'table':{if(!Array.isArray(w.dates)||!w.dates.length)return null;for(const ds of w.dates){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(ds);if(!m||!realDate(+m[1],+m[2],+m[3]))return null;c.push(mk(+m[1],+m[2],+m[3],off))}return pick(c)}}
  return null}
/* message window = [max(now, event start − leadH), event end); items with neither event nor sale use the event window itself */
function libWindows(it,now){const ev=libWhen(it&&it.when,now);if(!ev)return null;const lead=(it.event||it.sale)?(it.when.leadH||0)*HOUR:0;return {ev,msg:{start:Math.max(Math.floor(now/MIN)*MIN,ev.start-lead),end:ev.end}}}
/* ---- placeholders ---- */
function t12(t){const d=new Date(t);let h=d.getHours();const ap=h<12?'AM':'PM';h=h%12||12;return h+':'+pad(d.getMinutes())+' '+ap}
/* placeholders describe the announced window: the rule's window when the item has an event or a sale, else the message window */
function libCtx(it,W){const w=(it.event||it.sale)?W.ev:W.msg,s=new Date(w.start),e0=new Date(w.end),eT=e0.getHours()===0&&e0.getMinutes()===0?w.end-MIN:w.end,e=new Date(eT),ev=it.event,sa=it.sale;
  return {weekday:WDL[s.getDay()],date:MO[s.getMonth()]+' '+s.getDate(),time:t12(w.start),end:WD[e.getDay()]+' '+t12(eT),year:String(s.getFullYear()),
    mult:ev&&MULTS.indexOf(ev.mult)>=0?ev.mult+'×':null,pct:sa&&typeof sa.pct==='number'&&sa.pct>0?sa.pct+'%':null,bonus:sa&&typeof sa.bonus==='number'&&sa.bonus>0?'+'+sa.bonus+'%':null}}
function libFill(str,ctx,miss){return String(str==null?'':str).replace(/\{(weekday|date|time|end|year|mult|pct|bonus)\}/g,(m,k)=>{if(ctx[k]==null){if(miss)miss.add(m);return m}return ctx[k]})}
/* "Used": a motd whose title matches the item's title template (placeholders match anything) */
function libTitleRe(t){return new RegExp('^'+String(t||'').split(/\{(?:weekday|date|time|end|year|mult|pct|bonus)\}/).map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('.+?')+'$')}
function libUsed(it){if(!S.loaded.motd||!S.motd.length)return null;let re;try{re=libTitleRe(it.msg.t)}catch(e){return null}const hits=S.motd.filter(m=>typeof m.t==='string'&&re.test(m.t));if(!hits.length)return null;
  const last=Math.max(...hits.map(m=>m.start||0)),d=new Date(last),txt='Used '+MO[d.getMonth()]+' '+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?', '+d.getFullYear():'');
  return {txt,title:'Already in Messages '+hits.length+'× (latest starts '+when(last)+')'}}
/* ---- plain-words windows ---- */
function dShort(t){const d=new Date(t);return WD[d.getDay()]+' '+MO[d.getMonth()]+' '+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?', '+d.getFullYear():'')}
function fmtWin(s,e){const a=new Date(s),z=new Date(e),mid=x=>x.getHours()===0&&x.getMinutes()===0;
  if(mid(a)&&mid(z)){const days=Math.round((new Date(z.getFullYear(),z.getMonth(),z.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/DAY);return days<=1?dShort(s)+', all day':dShort(s)+' → '+dShort(e-MIN)}
  if(new Date(e-1).toDateString()===a.toDateString())return dShort(s)+', '+t12(s)+' → '+t12(e);
  return dShort(s)+', '+t12(s)+' → '+dShort(e)+', '+t12(e)}
function libWhenTxt(it,W,now){if(it.when&&it.when.rule==='now')return 'When you publish, for '+dur(W.ev.end-W.ev.start);return fmtWin(W.ev.start,W.ev.end)+(W.ev.start<=now?' · on now':'')}

  c.save();c.translate(cx+x*z,cy+y*z);try{(MO_DRAW[d.look]||MO_DRAW.station)(c,k,d,ts,rgb,dir)}catch(e){}c.restore();

/* ---------- Analytics: retention by the version a player started on, and day-by-day health ----------
   From the anonymous daily check-ins (plays, the last 35 days). A player's version is the one they played on their first
   day. Next day: played the day after their first. 3+ days and Week: played again 3 / 7 or more days after their first.
   Score (0 to 100): next day, 3+ days and week weighted 50/30/20, from whichever of them are old enough to count. */
function verKey(v){const m=String(v||'').match(/^(\d+)\.(\d+)/);return m?m[1]+'.'+m[2]:'?'}

    if(p.d0&&p.d0<I.d0)I.d0=p.d0;I.days[p.day]=1;I.lv=Math.max(I.lv,p.lv||0);if(p.day>=I.last){I.last=p.day;I.vLast=p.v||''}
    if(p.day<I.v0Day){I.v0Day=p.day;I.v0=p.v||''}if(p.day===(p.d0||p.day))I.min0+=p.min||0}
  return inst}
function anaRet(){const today=dstr(Date.now()),win=addDays(today,-34),inst=anaInst(),C={};
  for(const k in inst){const I=inst[k];if(I.d0<win||I.v0Day!==I.d0)continue;// started in the window, and we have their first day
    const v=verKey(I.v0);const c=C[v]||(C[v]={v,n:0,e1:0,r1:0,e3:0,r3:0,e7:0,r7:0,min:0,lv:0});c.n++;c.min+=I.min0;c.lv+=I.lv;
    const ds=Object.keys(I.days);
    if(I.d0<=addDays(today,-2)){c.e1++;if(I.days[addDays(I.d0,1)])c.r1++}
    if(I.d0<=addDays(today,-4)){c.e3++;const l=addDays(I.d0,3);if(ds.some(d=>d>=l))c.r3++}
    if(I.d0<=addDays(today,-8)){c.e7++;const l=addDays(I.d0,7);if(ds.some(d=>d>=l))c.r7++}}
  const L=Object.values(C).filter(c=>c.v!=='?').sort((a,b)=>verCmp(a.v,b.v));
  const sc=(c,use)=>{const P=[[c.e1,c.r1,.5],[c.e3,c.r3,.3],[c.e7,c.r7,.2]].filter((x,i)=>use[i]);const w=P.reduce((a,x)=>a+x[2],0);return w?Math.round(P.reduce((a,x)=>a+x[1]/x[0]*x[2],0)/w*100):null};
  const ok=c=>[c.e1>=3,c.e3>=3,c.e7>=3];
  for(const c of L)c.score=sc(c,ok(c));
  // the change from the version before: only on the measures both versions have (a new version has no week yet)
  L.forEach((c,i)=>{const p=L[i+1];c.delta=null;if(!p||c.score==null||p.score==null)return;const a=ok(c),b=ok(p),both=a.map((x,k)=>x&&b[k]);if(!both.some(Boolean))return;c.delta=sc(c,both)-sc(p,both)});
  return L}

const SECTIONS=[
  {k:'home',n:'Home',ic:'home',pages:[['home','Home','home']]},
  {k:'stats',n:'Stats',ic:'chart',pages:[['stats','Players','users'],['retention','Retention','refresh'],['progress','Progress','route'],['perf','Message stats','msg']]},
  {k:'live',n:'Live ops',ic:'rocket',pages:[['messages','Messages','msg'],['library','Library','book'],['events','Meteor events','comet'],['store','Store sales','shop'],['monuments','Monuments','trophy'],['updates','Game updates','up']]},
  {k:'players',n:'Players',ic:'users',pages:[['profiles','Profiles','user'],['boards','Leaderboards','crown'],['names','Names','list'],['tags','Tags','tag']]},
  {k:'inbox',n:'Inbox',ic:'bell',pages:[['support','Support','chat'],['feedback','Feedback','star'],['reports','Reports','flag']]}];
const PAGE={};SECTIONS.forEach(s=>s.pages.forEach(p=>{PAGE[p[0]]={sec:s.k,n:p[1],ic:p[2]}}));
const SEC={};SECTIONS.forEach(s=>{SEC[s.k]=s});
S.ov2={mF:'all',mQ:'',plF:'all',plSort:'recent',suF:'all',menu:false,last:{}};
function pageFor(t){if(PAGE[t])return t;if(t==='overview')return 'home';
  if(t==='players'){if(S.prof||S.mail)return 'profiles';const s=S.plSec;return s==='reports'?'reports':PAGE[s]?s:'profiles'}return 'home'}
go=function(tab){const p=pageFor(tab);S.tab=p;S.ov2.menu=false;try{history.replaceState(null,'','#'+p)}catch(e){}S.ov2.last[PAGE[p].sec]=p;render();window.scrollTo(0,0)};

/* ---- badges ---- */
function bdg(p){const t=Date.now();
  if(p==='messages'){if(S.draft)return '<span class="bd gold" title="Draft in progress">✎</span>';const n=S.motd.filter(m=>mStatus(m,t)==='live').length;return n?'<span class="bd" title="'+n+' live">'+n+'</span>':''}
  if(p==='events')return S.live.events.some(e=>itemSt(e,t)==='live')?'<span class="bd dot" title="Event live"></span>':'';
  if(p==='store')return S.live.sales.some(s=>itemSt(s,t)==='live')?'<span class="bd dot" title="Sale live"></span>':'';
  if(p==='support'){const n=supWaiting();return n?'<span class="bd red" title="'+n+' waiting">'+n+'</span>':''}
  if(p==='reports'){const n=S.rep.length;return n?'<span class="bd red" title="'+n+' open">'+(n>99?'99+':n)+'</span>':''}
  if(p==='feedback'){const n=fbNew();return n?'<span class="bd" title="'+n+' in the last day">'+n+'</span>':''}
  return ''}
function supWaiting(){try{return (S.sup.rows||[]).filter(x=>supUnread(x.data)&&!x.data.muted).length}catch(e){return 0}}
function fbNew(){const t=Date.now();return (S.fb||[]).filter(f=>(+f.at||0)>t-DAY).length}
function secBdg(k){if(k==='inbox'){const n=supWaiting()+S.rep.length;return n?'<span class="bd red">'+(n>99?'99+':n)+'</span>':''}
  if(k==='live'){if(S.draft)return '<span class="bd gold">✎</span>';const t=Date.now();return S.motd.some(m=>mStatus(m,t)==='live')||S.live.events.some(e=>itemSt(e,t)==='live')||S.live.sales.some(s=>itemSt(s,t)==='live')?'<span class="bd dot"></span>':''}
  return ''}

/* ---- shell ---- */
render=function(){if(!PAGE[S.tab])S.tab=pageFor(S.tab);renderHead();const v=$('#view');
  const g=gate();$('#nav').hidden=!!g;$('#side').hidden=!!g;$('#subnav').hidden=true;
  if(g){v.innerHTML=g;S.mounted=null;return}
  renderNav();
  if(S.tab==='messages'&&S.draft){if(S.mounted===S.draft&&$('#comp')){pvSoon();updateLive();return}v.innerHTML=banner()+composerHTML(S.draft);S.mounted=S.draft;mountComposer();return}
  S.mounted=null;
  if(S.tab==='stats')S.cw=chartWidth();
  let h='';try{h=(VIEWS[S.tab]||VIEWS.home)()}catch(e){console.error(e);h='<div class="card errc"><b>This page hit an error</b><p class="sub">'+esc(e.message||e)+'</p></div>'}
  v.innerHTML=banner()+h;
  if(S.tab==='stats')bindChart();
  if(S.flash){const el=$('[data-mid="'+S.flash+'"]');if(el){el.classList.add('flash');try{el.scrollIntoView({block:'nearest'})}catch(e){}}S.flash=null}};
renderNav=function(){const cur=PAGE[S.tab]||PAGE.home,sec=SEC[cur.sec];
  $('#nav').innerHTML=SECTIONS.map(s=>'<button data-sec2="'+s.k+'"'+(s.k===cur.sec?' aria-current="page"':'')+'>'+ic(s.ic)+'<span class="l">'+s.n+'</span>'+secBdg(s.k)+'</button>').join('');
  const sn=$('#subnav');if(sec.pages.length>1){sn.hidden=false;sn.innerHTML=sec.pages.map(p=>'<button data-tab="'+p[0]+'"'+(p[0]===S.tab?' aria-current="page"':'')+'>'+ic(p[2])+'<span>'+p[1]+'</span>'+bdg(p[0])+'</button>').join('');
    const on=sn.querySelector('[aria-current=page]');if(on){const l=on.offsetLeft-sn.clientWidth/2+on.clientWidth/2;if(Math.abs(sn.scrollLeft-l)>20)sn.scrollLeft=l}}else{sn.hidden=true;sn.innerHTML=''}
  $('#side').innerHTML=SECTIONS.map(s=>s.pages.length===1?'<div class="sgrp"><button class="sgh'+(s.k===cur.sec?' on':'')+'" data-tab="'+s.pages[0][0]+'"'+(s.k===cur.sec?' aria-current="page"':'')+'>'+ic(s.ic)+'<span>'+s.n+'</span></button></div>'
    :'<div class="sgrp"><div class="sgh'+(s.k===cur.sec?' on':'')+'">'+ic(s.ic)+'<span>'+s.n+'</span>'+secBdg(s.k)+'</div><div class="sgl">'+s.pages.map(p=>'<button data-tab="'+p[0]+'"'+(p[0]===S.tab?' aria-current="page"':'')+'>'+ic(p[2])+'<span>'+p[1]+'</span>'+bdg(p[0])+'</button>').join('')+'</div></div>').join('')
    +'<div class="sfoot">'+(DB.mode==='mock'?'Preview data · nothing reaches players':'Firestore · orbitalforge-81f30')+'</div>'};
renderHead=function(){const u=S.user,cur=PAGE[S.tab]||PAGE.home,sec=SEC[cur.sec];let h='';
  $('#crumb').innerHTML=u&&S.admin&&innerWidth<960&&sec.pages.length>1?esc(sec.n):'Orbital Forge';
  $('#ttl').textContent=u&&S.admin&&innerWidth<960&&cur.sec!=='home'?cur.n:'Command Center';
  if(u&&S.admin&&S.loadedAt)h+='<span class="upd">Updated '+esc(agoShort(S.loadedAt))+'</span>';
  if(DB.mode==='mock')h+='<button class="pchip" data-act="mockReset" title="Made-up data kept in this browser. Click to start it over.">Preview</button>';
  if(u&&S.admin)h+='<button class="ib" data-act="reload" aria-label="Reload data" title="Reload data">'+ic('refresh')+'</button>';
  if(u)h+='<button class="avatar" data-act="menu" aria-label="Account" aria-expanded="'+!!S.ov2.menu+'">'+esc((u.name||u.email||'?').trim()[0].toUpperCase())+'</button>';
  if(u&&S.ov2.menu)h+='<div class="menu" role="menu"><div class="me"><b>'+esc(u.name||'Signed in')+'</b><span>'+esc(u.email)+'</span></div>'
    +(S.admin?'<button data-act="reload" role="menuitem">'+ic('refresh')+'Reload all data</button>':'')
    +(DB.mode==='mock'?'<button data-act="mockReset" role="menuitem">'+ic('sparkle')+'Start the preview data over</button>':'')
    +'<button data-act="out" role="menuitem">'+ic('out')+'Sign out</button></div>';
  $('#acct').innerHTML=h};
function agoShort(t){const d=Math.max(0,Date.now()-t);return d<60e3?'just now':d<HOUR?Math.round(d/60e3)+' min ago':Math.round(d/HOUR)+' h ago'}
{const la=loadAll;loadAll=function(){S.loadedAt=Date.now();return la.apply(this,arguments)}}
// the bottom bar opens the page you were last on in that section
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-sec2]');if(!b)return;const s=SEC[b.dataset.sec2];if(!s)return;

document.addEventListener('click',e=>{if(!S.ov2.menu)return;if(e.target.closest&&e.target.closest('[data-act="menu"]'))return;
  if(e.target.closest&&e.target.closest('.menu')){if(e.target.closest('.menu button'))setTimeout(()=>{S.ov2.menu=false;renderHead()},0);return}S.ov2.menu=false;renderHead()},true);
// long page descriptions fold to two lines on phones; tap to read the rest
document.addEventListener('click',e=>{const s=e.target.closest&&e.target.closest('.pagehead .sub');if(s)s.classList.toggle('open')});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(t&&t!==S.tab&&(PAGE[t]||t==='overview'||t==='players'))go(t)});

/* ---- counting fix: a "next day" counts once that next day is over, so the numbers don't drop to 0 at 7 PM ---- */
// (applied in compute() and anaRet(): eligible from 2 days after the first day; 3+ days from 4; a week from 8)

   HOME
   ===================================================================== */
function todayNums(){const today=dstr(Date.now()),yd=addDays(today,-1);const td=S.plays.filter(p=>p.day===today),yy=S.plays.filter(p=>p.day===yd);
  const n=td.length,nw=td.filter(p=>p.day===(p.d0||p.day)).length,min=td.reduce((a,p)=>a+(+p.min||0),0);
  const vs=[...new Set(td.map(p=>verKey(p.v)))].filter(v=>v!=='?').sort(verCmp),lv=vs[0]||'',onL=lv?td.filter(p=>verKey(p.v)===lv).length:0;
  const yNew=new Set(yy.filter(p=>p.day===(p.d0||p.day)).map(p=>p.iid)),back=td.filter(p=>yNew.has(p.iid)).length;
  return {n,nw,ret:n-nw,mpp:n?Math.round(min/n):0,lv,onL,yN:yy.length,yNew:yNew.size,back}}
VIEWS.home=()=>{const t=Date.now();let h='';
  const hr=new Date().getHours(),hi=hr<5?'Late shift':hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  // today at a glance
  if(S.loaded.plays&&!S.errs.plays){const T=todayNums();
    h+='<div class="hero"><div class="hk"><span class="live"></span>Today in the galaxy<span class="t">'+esc(hi)+', Commander</span></div>'
      +'<div class="hmain"><div class="hbig">'+nf(T.n)+'</div><div class="hcap">players today<br><span class="sub">Yesterday: <b>'+nf(T.yN)+'</b> · the day resets at '+esc(resetTime())+'</span></div></div>'
      +'<div class="hgrid">'+hst('sparkle','New',nf(T.nw),'first time today')+hst('refresh','Returning',nf(T.ret),'played before today')+hst('clock','Min / player',T.mpp,'today so far')
      +hst('up',T.lv?'On v'+esc(T.lv):'Latest version',T.n?Math.round(T.onL/T.n*100)+'%':'–',T.onL+' of '+T.n)+'</div>'

function playedOn(o,n,roll){const d=addDays(o.d0,n);return roll?Object.keys(o.days).some(x=>x>=d):!!o.days[d]}

  for(const k in out)out[k].p=out[k].e?out[k].r/out[k].e:null;return out}
VIEWS.goals=()=>{let h=head('Targets','How each version scores against top games, what brings players back the next day, and what the next update needs to reach.');

    const life=d1.e>=8?gLife(d1.p,d7.e>=8?d7.p:null):null;
    return {v,n:L.length,d1,d3,d7,min:gMed(z.map(x=>x.min)),ses:z.length?z.reduce((a,x)=>a+(x.sess||1),0)/z.length:0,lv3:z.filter(x=>x.lv>=3).length/L.length,lv8:z.filter(x=>x.lv>=8).length/L.length,life}});

    '<div class="tw"><table class="tbl gtbl"><thead><tr><th>Version</th><th>New</th><th>Back day 1</th><th>Day 3</th><th>Day 7</th><th>Day-one minutes</th><th>Day-one sessions</th><th>Lv 3 on day one</th><th>Lv 8 on day one</th><th>Days per install</th></tr></thead><tbody>'
    +rows.map(r=>'<tr><td><b>v'+esc(r.v)+'</b></td><td>'+r.n+'</td>'+gCell(r.d1,.25,.30)+gCell(r.d3,-1,-1).replace(' good','')+gCell(r.d7,.04,.065)
      +'<td>'+(r.min==null?'—':r.min+' min')+'</td><td>'+r.ses.toFixed(1)+'</td><td>'+pctx(r.lv3)+'</td><td>'+pctx(r.lv8)+'</td><td title="Estimated days played in the first 90, per install">'+(r.life?r.life.toFixed(1):'—')+'</td></tr>').join('')
    +'</tbody></table></div><div class="gbm">'+BM.d1.map(b=>'<span>'+esc(b[0])+': <b>'+pctx(b[1])+'</b> back on day 1</span>').join('')+BM.d7.map(b=>'<span>'+esc(b[0])+': <b>'+(b[1]*100).toFixed(b[1]<.1?1:0)+'%</b> on day 7</span>').join('')+'</div>');

    +['early','mid','deep'].map(k=>'<tr><td>'+lab[k]+'</td><td>'+(all[k].e?'<b>'+pctx(all[k].p)+'</b> <small class="mu2">'+all[k].r+'/'+all[k].e+'</small>':'—')+'</td>'+per.map(x=>'<td>'+(x.d[k].e>=5?pctx(x.d[k].p)+' <small class="mu2">'+x.d[k].e+'</small>':'<span class="mu2">—</span>')+'</td>').join('')+'<td class="mu2">'+pctx(GM[k])+'</td></tr>').join('')

function cxSplit(key){const i=key.indexOf(':');return [key.slice(0,i),key.slice(i+1)]}
function cxEff(key,draft){const b=CXB&&CXB[key]||null,o=S.cx.items[key]||null;const e=Object.assign({},b||{},o||{},draft||{});const [k,id]=cxSplit(key);e.k=k;e.id=id;e.key=key;e.built=!!b;e.ov=!!o;
  const src=Object.assign({},o||{},draft||{});if(src.sh!=null){delete e.how;e.hw=''}else if(src.how){delete e.sh;e.hw=cxHowTxt(src.how)}
  e.st=!b?'mine':o?'changed':'built';return e}
function cxAll(){const out=[],seen=new Set();if(CXB)for(const key in CXB){out.push(cxEff(key));seen.add(key)}for(const key in S.cx.items)if(!seen.has(key))out.push(cxEff(key));return out}
const CX_OLD={lv:'lv',asc:'asc',sys:'sys',book:'codex',quests:'quests',hours:'hours',chap:'chap',streak:'streak',tops:'tops',top:'tops'};
const CX_STAT2G={masteryTiers:'mastery',mined:'mined',asteroids:'asteroids',meteors:'meteors',crits:'crits',lucky:'lucky',caches:'caches',smelted:'smelted',crafted:'crafted',recipes:'recipes',asmDone:'asm',forgeTaps:'forge',autoNodes:'auto',shiny:'shiny',colonies:'colonies',rover:'rover',hired:'hired',star3:'star3',rooms:'rooms',contracts:'contracts',creditsEarned:'credits',crates:'crates',spins:'spins',boostersFound:'found',used:'boosts',ads:'videos'};
function cxWhen(s){try{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}catch(e){return s}}
// one goal as a picker goal {g,n,w}, when it is one
function cxAsGoal(p){if(!p)return null;if(p.g)return {g:p.g,n:p.n,w:p.w||'',d:p.d||''};if(p.stat&&CX_STAT2G[p.stat])return {g:CX_STAT2G[p.stat],n:p.n,w:p.w||''};for(const k in CX_OLD)if(p[k]!=null)return {g:CX_OLD[k],n:+p[k],w:''};return null}
function cxPartTxt(p){if(p.w)return p.w;const g=cxAsGoal(p);if(g&&CCX_GOALMAP[g.g])return ccxGoalText(g.g,g.n,g.d);if(p.pod)return p.pod===1?'Finish a week at #1':'Finish a week at #'+p.pod;if(p.pod3)return 'Finish a week in the top 3';return p.stat||'Earned'}
function cxHowTxt(w){if(!w)return '';if(w.g||w.all||w.any||w.from||w.to){const P=w.all||w.any||[w];let t=w.w||P.map(cxPartTxt).join(w.any?' or ':' and ');
    if(w.from&&w.to)t+=' ('+cxWhen(w.from)+' to '+cxWhen(w.to)+')';else if(w.from)t+=' (from '+cxWhen(w.from)+')';else if(w.to)t+=' (until '+cxWhen(w.to)+')';return t}
  if(w.pod||w.pod3)return cxPartTxt(w);
  return cxHowTxtOld(w)}
function cxHowTxtOld(w){if(!w)return '';if(w.lv)return 'Reach Level '+w.lv;if(w.asc)return w.asc>1?'Ascend '+w.asc+' times':'Ascend once';if(w.top)return 'A weekly top 10';if(w.tops)return w.tops+' weekly top 10s';
  if(w.streak)return 'A '+w.streak+'-day daily streak';if(w.stat)return w.w||w.stat;if(w.sys)return 'Reach system '+w.sys;if(w.book)return w.book+' codex entries';if(w.quests)return w.quests+' quests';
  if(w.hours)return w.hours+' hours played';if(w.chap)return 'Story chapter '+w.chap;return 'Earned'}
const cxU=svg=>{const u='cxu'+Math.random().toString(36).slice(2,7);return String(svg).replace(/\{u\}/g,u)};
function cxBadge(){const p=Array.from({length:6},(_,i)=>{const a=Math.PI/180*(60*i-90);return (30+17*Math.cos(a)).toFixed(2)+','+(30+17*Math.sin(a)).toFixed(2)}).join(' ');
  return '<polygon points="'+p+'" fill="#141c3d" stroke="#6b7bc4" stroke-width="1.6"/><text x="30" y="34.2" text-anchor="middle" font-size="11.5" font-weight="800" fill="#fff" font-family="system-ui,sans-serif">42</text>'}
function cxArtOk(e){if(!e.av)return null;const a=S.cx.art[e.key];if(a&&(a.v||0)>=e.av)return a;if(!a||!a.missing)cxLoadArt(e.key);return a&&a.missing?a:null}
function cxArtNorm(d){if(!d)return d;d=Object.assign({},d);if(typeof d.sky==='string'){try{d.sky=JSON.parse(d.sky)}catch(e){delete d.sky}}
  if(d.sky){const r=ccxSky(d.sky,!!d.img);if(r.err)delete d.sky;else d.sky=r.sky}if(d.img&&!ccxImg(d.img))delete d.img;
  if(d.svg!=null){const r=ccxSvg(d.svg,{max:900000});if(r.err)delete d.svg;else d.svg=r.svg}return d}
function cxLoadArt(key){if(S.cx.artBusy[key])return;const it=S.cx.items[key];if(!it||!it.av)return;S.cx.artBusy[key]=1;const [k,id]=cxSplit(key);
  DB.get('cc_art/'+ccxDoc(k,id)).then(d=>{S.cx.art[key]=d&&(+d.v||0)>=it.av?cxArtNorm(d):{v:0,missing:1}},e=>{S.cx.art[key]={v:0,missing:1,err:fsErr(e)}}).finally(()=>{delete S.cx.artBusy[key];cxRedraw()})}
const cxSkyC={},cxStarC={};
function cxSkyImg(key,art,w,h){w=w||132;h=h||84;const ck=key+'@'+(art.v||'x')+':'+w+':'+(art.img?art.img.length:0)+':'+JSON.stringify(art.sky).length;if(cxSkyC[ck]!==undefined)return cxSkyC[ck];
  const go=im=>{try{const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');CCXP.skyPaint(art.sky,im)(g,w,h,CCXP.rngSeed(CCXP.hashStr(key)));cxSkyC[ck]=cv.toDataURL('image/jpeg',.85)}catch(e){console.error(e);cxSkyC[ck]=''}};
  if(art.img){cxSkyC[ck]='';const im=new Image();im.onload=()=>{go(im);cxRedraw()};im.src=art.img;return ''}go(null);return cxSkyC[ck]}
function cxStarImg(e,s){s=s||64;const ck=[e.path,e.path2,e.c,e.a,s].join('|');if(cxStarC[ck])return cxStarC[ck];const cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d');const col=e.c||'#ffd166';
  try{const gr=g.createRadialGradient(s/2,s/2,2,s/2,s/2,s/2);gr.addColorStop(0,col+'66');gr.addColorStop(1,col+'00');g.fillStyle=gr;g.fillRect(0,0,s,s);g.translate(s/2,s/2);g.scale(s*.3,s*.3);g.shadowColor=col;g.shadowBlur=s*.15;g.fillStyle=col;g.fill(new Path2D(e.path));
    if(e.path2){g.shadowBlur=0;g.fillStyle=e.a||'#ffffff';g.fill(new Path2D(e.path2))}}catch(x){}cxStarC[ck]=cv.toDataURL('image/png');return cxStarC[ck]}
function cxSwatch(e){const c=e.c,k=e.k;const col=v=>/^#[0-9a-f]{6}$/i.test(v||'')?v:'#9aa6c7';
  if(k==='hull')return '<svg viewBox="-16 -10 32 20" width="40" height="26"><path d="M12 0 L-8 7 L-5 0 L-8 -7Z" fill="'+(c==='prism'?'#f472b6':col(c))+'"/><circle cx="3" cy="0" r="2.2" fill="'+col(e.a)+'"/></svg>';
  if(k==='trail'||k==='ptrail'){const bg=!c?'transparent':c==='rainbow'||e.cyc==='rainbow'?'linear-gradient(90deg,#f87171,#fbbf24,#4ade80,#3aa7ff,#c084fc)':Array.isArray(e.cyc)?'linear-gradient(90deg,'+e.cyc.join(',')+')':'linear-gradient(90deg,transparent,'+col(c)+')';return '<span class="cxSw tr" style="background:'+bg+'"></span>'}
  if(k==='probe')return '<svg viewBox="-8 -6 16 12" width="30" height="22"><path d="M6 0 L-5 3.5 L-2.5 0 L-5 -3.5Z" fill="'+col(c)+'"/><circle cx="-6.5" cy="0" r="1.2" fill="'+col(e.b)+'"/></svg>';
  if(k==='star')return '<span class="cxSw st" style="--c:'+(c?col(c):'#ffd166')+'"></span>';
  if(k==='orbit')return '<span class="cxSw ob'+(e.dash?' dash':'')+'" style="--c:'+(c&&c!=='none'?col(c):'rgba(142,154,200,.35)')+'"></span>';
  if(k==='ui')return '<span class="cxSw ui" style="background:linear-gradient(135deg,'+col(c)+' 50%,'+col(e.a)+' 50%)"></span>';
  if(k==='th')return '<span class="cxSw ui" style="background:'+col(c)+'"></span>';return ''}
// the picture of an item: its drawing (yours), or the built-in picture, or a swatch from its colours
function cxThumb(e){const k=e.k,art=cxArtOk(e);
  if(e.av&&!art)return '<span class="cxTh '+k+' wait" title="Loading the drawing">'+ic('clock')+'</span>';
  if(art&&art.missing)return '<span class="cxTh '+k+' wait bad" title="The drawing isn\'t on the server">'+ic('alert')+'</span>';
  const img=src=>'<span class="cxTh '+k+'"><img alt="" src="'+src+'"></span>';
  if(k==='pq'){if(art&&art.svg)return '<span class="cxTh pq"><svg viewBox="0 0 60 60" aria-hidden="true">'+cxU(art.svg)+cxBadge()+'</svg></span>';if(e.img)return img(e.img)}
  if(k==='th'){if(art&&art.svg)return '<span class="cxTh th"><svg viewBox="162 0 200 64" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+cxU(art.svg)+'</svg></span>';if(e.img)return img(e.img)}
  if(k==='sky'){if(art&&art.sky){const u=cxSkyImg(e.key,art);return '<span class="cxTh sky">'+(u?'<img alt="" src="'+u+'">':'')+'</span>'}if(e.img)return img(e.img)}
  if(k==='star'){if(e.path)return img(cxStarImg(e));if(e.img&&!(S.cx.items[e.key]||{}).c)return img(e.img)}
  if(k==='ui'&&e.img&&!S.cx.items[e.key])return img(e.img);
  return '<span class="cxTh sw">'+cxSwatch(e)+'</span>'}
// a drawing straight from a pasted code (before it's on the server)
function cxThumbCode(r){const e=Object.assign(cxEff(r.key),r.item);delete e.av;if(r.art){const a=Object.assign({v:'code'},r.art);
    if(r.item.k==='pq')return '<span class="cxTh pq"><svg viewBox="0 0 60 60" aria-hidden="true">'+cxU(a.svg)+cxBadge()+'</svg></span>';
    if(r.item.k==='th')return '<span class="cxTh th"><svg viewBox="162 0 200 64" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+cxU(a.svg)+'</svg></span>';
    if(r.item.k==='sky'){const u=cxSkyImg('code:'+r.key,a);return '<span class="cxTh sky">'+(u?'<img alt="" src="'+u+'">':'')+'</span>'}}
  return cxThumb(e)}
function cxRedraw(){if(S.tab!=='shopitems')return;const a=document.activeElement;if(a&&a.closest&&a.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){S.cx.pend=true;return}render()}
document.addEventListener('focusout',()=>{if(!S.cx.pend)return;setTimeout(()=>{const a=document.activeElement;if(S.cx.pend&&!(a&&a.closest&&a.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){S.cx.pend=false;cxRedraw()}},60)},true);

function cxList(){const q=S.cx.q.trim().toLowerCase();const ord={mine:0,changed:1,built:2};const ko=CX_KL.map(x=>x[0]);

    .sort((a,b)=>(ord[a.st]-ord[b.st])||(ko.indexOf(a.k)-ko.indexOf(b.k))||(a.sh==null)-(b.sh==null)||((a.sh||0)-(b.sh||0)))}
function cxResHTML(){const L=cxList();if(!L.length)return '<div class="card"><div class="empty">Nothing here.</div></div>';

function cxTierHTML(e){const t=e.k==='pq'||e.k==='th'?CX_TIER[e.tier]:CX_RAR[e.rar];return t?'<i class="cxTier" style="--c:'+t[1]+'">'+t[0]+'</i>':''}
function cxPriceHTML(e){return e.free?'<span class="cxGoal">Free</span>':e.sh!=null?'<span class="cxPrice">'+ic('sparkle')+e.sh+'</span>':'<span class="cxGoal">'+esc(e.hw||'Earned')+'</span>'}
function cxRow(e){const chips=(e.st==='mine'?'<span class="chip cxMine">Yours</span>':e.st==='changed'?'<span class="chip cxChg">Changed</span>':'')+(e.off?'<span class="chip cxOff">Off the Shop</span>':'')+(!e.off&&e.show?'<span class="chip cxChg">'+esc((e.show.from?cxWhen(e.show.from):'…')+' to '+(e.show.to?cxWhen(e.show.to):'…'))+'</span>':'')+(e.hol?'<span class="chip soft">'+(e.hol==='hw'?'Halloween':'Holiday')+'</span>':'');

function cxClash(R){if(!R||!R.list)return;let size=JSON.stringify(S.cx.items).length;
  for(const r of R.list){if(!r.item)continue;const {k,id}=r.item;size+=JSON.stringify(r.item).length;if(k==='pq'||k==='th')continue;
    for(const k2 in CCX_SLOT)if(k2!==k&&((CXB&&CXB[ccxKey(k2,id)])||S.cx.items[ccxKey(k2,id)])){r.errs.push('The id "'+id+'" is already used by a '+CCX_KINDS[k2].toLowerCase()+': give it another id');break}}
  if(size>900000&&R.list.length)R.list[0].errs.push('The list of items would be too big (the most is about 1 MB). Make pattern and shape codes shorter, or delete items you don\'t use.')}
function cxIsNew(k,id){const key=ccxKey(k,id);return !(CXB&&CXB[key])&&!S.cx.items[key]}
function cxChkHTML(R){if(R.err)return '<div class="cxErr">'+ic('alert')+'<span>'+esc(R.err)+'</span></div>';const bad=R.list.filter(r=>r.errs.length).length;

// changes: {key: entry or null (delete)}; arts: [{doc, data or null}]
async function cxWrite(changes,arts,msg){S.cx.busy=true;cxRedraw();
  try{const del=[];for(const a of arts||[]){if(a.data)await DB.set('cc_art/'+a.doc,a.data);else del.push(a.doc)}
    const ops=await DB.tx(['config/cc'],cur=>{const items=Object.assign({},cur['config/cc']&&cur['config/cc'].items||{});for(const k in changes){if(changes[k])items[k]=changes[k];else delete items[k]}
      return [{op:'set',path:'config/cc',data:{items,up:Date.now()}}]});
    S.cx.items=ops[0].data.items;for(const d of del)await DB.del('cc_art/'+d).catch(()=>{});
    for(const a of arts||[]){const [k,id]=[a.doc.slice(0,a.doc.indexOf('-')),a.doc.slice(a.doc.indexOf('-')+1)];if(a.data)S.cx.art[k+':'+id]=cxArtNorm(a.data);else delete S.cx.art[k+':'+id]}

function ecNow(p){return S.ec.o[p]!=null?S.ec.o[p]:LVF&&LVF[p]?LVF[p].v:null}
// what's typed, as a number: "1,500" is fifteen hundred, "1.5" one and a half, "1e20" works; "1,5" is refused (use a dot)
function ecParse(raw){raw=String(raw).trim();if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(raw))raw=raw.replace(/,/g,'');if(raw===''||/[^0-9.eE+-]/.test(raw))return null;const v=+raw;return isFinite(v)?v:null}

  const f=LVF&&LVF[p];const n=ecParse(raw);const v=f&&n!=null?lvNum(f.k,n):null;return {has:true,raw,v,ok:v!=null&&!ecRoomErr(p),comma:/,/.test(String(raw))&&n==null}}

function ecVal(p){const d=ecDraft0(p);if(d.back)return LVF[p]?LVF[p].v:null;if(d.has){const f=LVF[p];const n=ecParse(d.raw);return f&&n!=null?lvNum(f.k,n):null}return ecNow(p)}
function ecDraft0(p){const d=S.ec.draft;if(!(p in d))return {has:false};return d[p]===null?{has:true,back:true}:{has:true,raw:d[p]}}
function ecRoomErr(p){const f=LVF&&LVF[p];if(!f||f.g!=='rooms'||!f.t||f.iid==='buy')return '';const b='room.'+f.iid+'.';
  if(![b+'base',b+'per',b+'max'].some(x=>x in S.ec.draft))return '';const v=[ecVal(b+'base'),ecVal(b+'per'),ecVal(b+'max')];if(v.some(x=>x==null))return '';
  return lvRoomOk(f.t,v[0],v[1],v[2])?'':(f.t==='m'?'Level 1 can\'t be below 0.05.':'At its top level this room would take prices or times down to 5% or less: lower “Each level takes off” or the max level.')}
function ecPending(){const out=[];for(const p in S.ec.draft){const d=ecDraft(p);const f=LVF&&LVF[p];if(!f)continue;
  if(d.back){if(S.ec.o[p]!=null)out.push({p,f,back:true,ok:true});continue}
  if(!d.ok){out.push({p,f,ok:false});continue}if(d.v===ecNow(p)&&(S.ec.o[p]!=null||f.v23==null))continue;out.push({p,f,v:d.v,ok:true})}return out}
VIEWS.economy=()=>{let h=head('Economy','Change any number of the game: what things sell for, what a recipe uses and how long it takes, what upgrades and research cost, how high they go. Only what you change is sent, and players get it within a minute (games 1.23 and newer). Everything else stays as built in.');
  const st=secState('econ');if(st)return h+st;h+=lvNoCat();if(!LVC)return h;
  h+='<div id="ecBar">'+ecBarHTML()+'</div>';
  const ch=Object.keys(S.ec.o).filter(p=>LVF[p]);
  h+='<section class="card"><div class="ph"><h2>'+ic('coins')+' Changed now'+(ch.length?' <small class="lvCnt">'+ch.length+'</small>':'')+'</h2>'+(ch.length?'<button class="btn sm sec" data-act="ecAllBack">Put all back</button>':'')+'</div>';
  if(!ch.length)h+='<p class="sub">Nothing: the economy is as built in.</p>';
  else h+='<div class="lvOffL">'+ch.map(p=>{const f=LVF[p];const d=ecDraft(p);return '<div class="lvOffR"><div class="grow"><b>'+esc(f.it)+' · '+esc(f.l)+'</b><span class="sub">'+esc(f.gn)+' · <b class="lvNew">'+lvFmt(S.ec.o[p])+'</b> (built in '+lvFmt(f.v)+(f.v23!=null?', '+lvFmt(f.v23)+' in galaxies started in 1.23':'')+')'+(d.back?' · <b class="lvWarn">put back when you publish</b>':'')+'</span></div>'
    +(d.back?'<button class="btn sm sec" data-act="ecUndo" data-v="'+esc(p)+'">Keep it</button>':'<button class="btn sm sec" data-act="ecBack" data-v="'+esc(p)+'">Put back</button>')+'</div>'}).join('')+'</div>';
  const bad=S.ec.bad.length+Object.keys(S.ec.o).filter(p=>!LVF[p]).length;if(bad)h+='<p class="note" style="color:#ff8ea3">'+bad+' number'+(bad>1?'s':'')+' on the server this page doesn\'t know (from a newer game, or no longer in it).</p>';
  h+='</section>';
  const G=LVC.econ;const g=G.find(x=>x.g===S.ec.grp)||G[0];
  h+='<section class="card"><div class="ph"><h2>'+ic('edit')+' Change a number</h2></div>';
  h+='<div class="lvChips" role="group" aria-label="Part of the economy">'+G.map(x=>'<button class="cxChip" data-act="ecGrp" data-v="'+x.g+'" aria-pressed="'+(g.g===x.g&&!S.ec.q.trim())+'">'+esc(x.n)+'</button>').join('')+'</div>';
  h+='<label class="cxSearch lvSearch">'+ic('search')+'<input class="inp" data-lv="eq" placeholder="Search everything (an item, a project, a planet…)" value="'+esc(S.ec.q)+'" aria-label="Search"></label>';
  h+='<div id="ecRes">'+ecResHTML()+'</div>';
  return h+'</section>'};
function ecList(){const q=S.ec.q.trim().toLowerCase();const out=[];
  for(const g of LVC.econ){if(!q&&g.g!==S.ec.grp)continue;for(const it of g.items){if(q&&!(it.n.toLowerCase().includes(q)||it.id.toLowerCase().includes(q)||it.f.some(f=>f.l.toLowerCase().includes(q))))continue;out.push({g,it})}}return out}
function ecResHTML(){const L=ecList();const q=S.ec.q.trim();const g=LVC.econ.find(x=>x.g===S.ec.grp);
  let h=!q&&g?'<p class="sub lvD">'+esc(g.d)+'</p>':'';if(!L.length)return h+'<div class="empty">Nothing here.</div>';
  h+='<div class="ecList">'+L.slice(0,S.ec.lim).map(({g,it})=>'<div class="ecIt"><div class="ecH"><b>'+esc(it.n)+'</b><span class="sub">'+esc(q?g.n+(it.sub?' · '+it.sub:''):it.sub||'')+'</span></div>'+it.f.map(ecFieldHTML).join('')+'</div>').join('')+'</div>';
  if(L.length>S.ec.lim)h+='<button class="btn sec cxMore" data-act="ecMore">Show '+Math.min(20,L.length-S.ec.lim)+' more of '+(L.length-S.ec.lim)+'</button>';return h}
function ecFieldHTML(f){const d=ecDraft(f.p);const now=ecNow(f.p);const chg=S.ec.o[f.p]!=null;const val=d.has?(d.back?f.v:d.raw):now;const K=LV_KIND[f.k];
  const cls=d.has&&!d.ok?' bad':d.has&&(d.back||d.v!==now)?' dirty':chg?' chg':'';
  return '<label class="ecF'+cls+'" data-p="'+esc(f.p)+'"><span class="ecL">'+esc(f.l)+'<small>Built in '+lvFmt(f.v)+(f.v23!=null?' · '+lvFmt(f.v23)+' in 1.23 galaxies':'')+'</small></span>'
    +'<input class="inp ecIn" type="text" inputmode="decimal" data-lv="f" data-p="'+esc(f.p)+'" value="'+esc(String(val))+'" aria-label="'+esc(f.l)+'" autocomplete="off">'
    +((chg||d.has)?'<button class="ib ecR" data-act="ecReset" data-v="'+esc(f.p)+'" aria-label="Put back as built in" title="Put back as built in">'+ic('refresh')+'</button>':'<span class="ecR"></span>')
    +(d.has&&!d.ok?'<span class="ecE">'+esc(ecErrTxt(f.p))+'</span>':'')+'</label>'}
function ecErrTxt(p){const f=LVF[p],d=ecDraft(p);if(d.comma)return 'Use a dot for decimals (1.5)';if(d.v==null)return ecRange(LV_KIND[f.k]);return ecRoomErr(p)}
function ecRange(K){return 'A '+(K.int?'whole ':'')+'number from '+lvFmt(K.lo)+' to '+(K.hi>=1e100?'any size':lvFmt(K.hi))}
function ecBarHTML(){const P=ecPending();if(!P.length)return '';const bad=P.filter(x=>!x.ok).length;
  return '<div class="ecBar"><span class="grow"><b>'+P.length+' change'+(P.length>1?'s':'')+' not published</b>'+(bad?'<span class="lvWarn"> · '+bad+' to fix</span>':'')+'</span><button class="btn sm sec" data-act="ecDiscard">Discard</button><button class="btn sm" data-act="ecPublish"'+(bad||S.ec.busy?' disabled':'')+'>'+ic('up')+'Publish</button></div>'}
function ecPaintBar(){const b=$('#ecBar');if(b)b.innerHTML=ecBarHTML()}
function ecPaintField(p){const el=document.querySelector('.ecF[data-p="'+CSS.escape(p)+'"]');const f=LVF[p];if(!el||!f)return;const d=ecDraft(p);const now=ecNow(p);const chg=S.ec.o[p]!=null;
  el.classList.toggle('bad',d.has&&!d.ok);el.classList.toggle('dirty',d.has&&d.ok&&(d.back||d.v!==now));el.classList.toggle('chg',!d.has&&chg);
  let e=el.querySelector('.ecE');if(d.has&&!d.ok){if(!e){e=document.createElement('span');e.className='ecE';el.appendChild(e)}e.textContent=ecErrTxt(p)}else if(e)e.remove()}
async function ecWrite(fn,msg){if(S.ec.busy)return false;S.ec.busy=true;ecPaintBar();
  try{const ops=await DB.tx(['config/econ'],cur=>{const c=lvEcon(cur['config/econ']&&cur['config/econ'].o);const o=fn(Object.assign({},c.o));return [{op:'set',path:'config/econ',data:{o,up:Date.now()}}]});
    S.ec.o=lvEcon(ops[0].data.o).o;S.ec.busy=false;toast(msg);return true}
  catch(e){S.ec.busy=false;toast(fsErr(e),'err');return false}finally{render()}}
Object.assign(ACT,{
  ecGrp:el=>{S.ec.grp=el.dataset.v;S.ec.q='';S.ec.lim=20;render()},
  ecMore:()=>{S.ec.lim+=20;const r=$('#ecRes');if(r)r.innerHTML=ecResHTML()},
  ecReset:el=>{const p=el.dataset.v;if(S.ec.o[p]!=null)S.ec.draft[p]=null;else delete S.ec.draft[p];render()},
  ecBack:el=>{S.ec.draft[el.dataset.v]=null;render()},
  ecUndo:el=>{delete S.ec.draft[el.dataset.v];render()},
  ecAllBack:()=>{for(const p in S.ec.o)S.ec.draft[p]=null;render()},
  ecDiscard:()=>{S.ec.draft={};render()},
  ecPublish:async()=>{const P=ecPending();if(!P.length||P.some(x=>!x.ok))return;
    const lines=P.slice(0,8).map(x=>x.f.it+' · '+x.f.l+': '+(x.back?'built in ('+lvFmt(x.f.v)+')':lvFmt(x.v))).join('\n')+(P.length>8?'\n… and '+(P.length-8)+' more':'');
    if(!await ask({title:'Publish '+P.length+' change'+(P.length>1?'s':'')+'?',body:esc(lines).replace(/\n/g,'<br>')+'<br><br>Every player on 1.23 or newer gets '+(P.length>1?'them':'it')+' within a minute.',ok:'Publish'}))return;
    const ok=await ecWrite(o=>{for(const x of P){if(x.back||(x.v===x.f.v&&x.f.v23==null))delete o[x.p];else o[x.p]=x.v}return o},'Published: players get it within a minute');if(ok){S.ec.draft={};render()}}});
document.addEventListener('input',e=>{const el=e.target;const k=el&&el.dataset&&el.dataset.lv;if(!k)return;
  if(k==='oq'){S.off.q=el.value;S.off.lim=40;const g=LVC&&LVC.off.find(x=>x.g===S.off.grp);const r=$('#offRes');if(r&&g)r.innerHTML=offResHTML(g)}
  else if(k==='code'){S.off.code=el.value;const c=$('#offBtnChk');if(c)c.innerHTML=offBtnChk(el.value.trim()?lvBtn(el.value.trim()):null)}
  else if(k==='eq'){S.ec.q=el.value;S.ec.lim=20;const r=$('#ecRes');if(r)r.innerHTML=ecResHTML()}
  else if(k==='f'){const p=el.dataset.p;const f=LVF&&LVF[p];if(!f)return;const raw=el.value.trim();const n=ecParse(raw);
    if(raw===''||(n!=null&&lvNum(f.k,n)===ecNow(p)&&S.ec.o[p]==null&&f.v23==null))delete S.ec.draft[p];else S.ec.draft[p]=raw;
    ecPaintField(p);if(f.g==='rooms'&&f.t)for(const x of ['base','per','max'])ecPaintField('room.'+f.iid+'.'+x);ecPaintBar()}});

.lvD{margin:0 0 10px}.lvSearch{display:block;margin:0 0 12px}.lvCnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--card3);font-size:12px;color:var(--tx);vertical-align:middle}

.lvLk{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:rgba(255,92,122,.12);color:#ff8ea3;flex:none}.lvLk .i{width:16px;height:16px}

.ecL{display:grid;gap:1px;font-size:13px;font-weight:700;min-width:0;overflow-wrap:anywhere}.ecL small{font-size:11.5px;font-weight:500;color:var(--mu2)}

.ecR{width:30px;height:30px}.ecF.chg{background:rgba(56,225,198,.07)}.ecF.chg .ecIn{box-shadow:inset 0 0 0 1px rgba(56,225,198,.5)}
.ecF.dirty{background:rgba(255,209,102,.08)}.ecF.dirty .ecIn{box-shadow:inset 0 0 0 1px rgba(255,209,102,.7)}
.ecF.bad .ecIn{box-shadow:inset 0 0 0 1px #ff5c7a}.ecE{grid-column:1/-1;font-size:12px;color:#ff8ea3}
.ecBar{position:sticky;top:8px;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin:0 0 12px;border-radius:13px;background:var(--card3);border:1px solid rgba(255,209,102,.55);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.ecBar .grow{flex:1 1 160px;min-width:0}
@media (max-width:520px){.ecList{grid-template-columns:minmax(0,1fr)}.ecF{grid-template-columns:minmax(0,1fr) 104px 30px}.ecBar .grow{flex-basis:100%}.ecBar .btn{flex:1 1 0}}
`;document.head.appendChild(st)})();

S.tab=pageFor(location.hash.slice(1)||'home');
render();
loadLibrary();
DB.init().catch(e=>{if(DB.mode!=='live')throw e;console.warn('[cc] Firebase unavailable, using preview data',e);S.fallback=e&&e.message||String(e);DB=mockDB();return DB.init()}).then(()=>{
  S.ready=true;if(DB.mode==='mock')window.__cc={get DB(){return DB},S:S,LIM:LIM};
  DB.onAuth(u=>{S.user=u;S.admin=!!(u&&ADMINS.indexOf(u.email)>=0);S.err=null;render();if(S.admin)loadAll()})
},e=>{S.ready=true;S.err=e;render()});
})();
